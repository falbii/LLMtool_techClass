<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Document Analysis Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: title on the left, session controls on the right -->
  <header>
    <div class="brand">
      <span class="logo">📄</span>
      <span class="title">Smart Document Analysis</span>
      <span id="session-status" class="status">no session</span>
    </div>
    <div class="controls">
      <select id="model-select" title="Model"><option>loading…</option></select>
      <button id="start-session">Start session</button>
      <select id="pdf-select" title="PDF"><option value="">— no PDF —</option></select>
      <label class="upload-label" title="Upload a PDF">
        ⬆ PDF<input type="file" id="pdf-file" accept=".pdf">
      </label>
    </div>
  </header>

  <!-- Centered chat column -->
  <main>
    <div id="chat-wrap">
      <div id="chat"></div>
    </div>

    <div id="composer">
      <div id="chips">
        <button class="cmd" data-cmd="summarize">✨ Auto-summarize</button>
        <button class="cmd" data-cmd="classify">🗂 Auto-classify</button>
        <button class="cmd" data-cmd="condense-check">🔎 Condense-check</button>
        <button class="cmd" data-cmd="benchmark">🏁 Benchmark</button>
      </div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Ask something about the selected PDF…" autocomplete="off" disabled>
        <button id="chat-send" title="Send" disabled>➤</button>
      </form>
    </div>
  </main>

  <!-- Floating progress log (bottom-right), toggled by the round button -->
  <button id="progress-toggle" title="Show progress log">📜</button>
  <div id="progress-panel">
    <div class="panel-header">Progress</div>
    <div id="progress"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
