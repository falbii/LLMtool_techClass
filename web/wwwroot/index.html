<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Tool for Extraction of Technical Data</title>
  <!-- ?v=N defeats stale browser caches: bump it when these files change -->
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>

  <!-- Top bar: title on the left, session controls on the right -->
  <header>
    <div class="brand">
      <span class="logo">📄</span>
      <span class="title">LLM Tool for Extraction of Technical Data</span>
      <span id="session-status" class="status">no session</span>
    </div>
    <div class="controls">
      <select id="model-select" title="Model"><option>loading…</option></select>
      <button id="start-session">Start session</button>
      <!-- Blunt "Ctrl+C": shuts the whole server down (relaunch to continue) -->
      <button id="stop-server" title="Stop the server (like Ctrl+C in the terminal)">⏹ Stop server</button>
    </div>
  </header>

  <!-- Small tab to re-open the top bar after it collapses (once a session starts) -->
  <button id="header-toggle" title="Show/hide controls" aria-label="Show or hide controls">
    <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <!-- Centered chat column -->
  <main>
    <div id="chat-wrap">
      <div id="chat"></div>
    </div>

    <div id="composer">
      <div id="chips">
        <button class="cmd" data-cmd="summarize">✨ Auto-summarize</button>
        <button class="cmd" data-cmd="classify">
          <svg class="cmd-ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
          Auto-classify
        </button>
        <span class="chip-divider" aria-hidden="true"></span>
        <button class="cmd" data-cmd="condense-check">🔎 Condense-check</button>
        <button class="cmd" data-cmd="benchmark">🏁 Benchmark</button>
      </div>
      <form id="chat-form">
        <!-- PDF attach: pick one of the available PDFs or upload a new one.
             The button label shows the attached file's name. -->
        <div id="pdf-attach-wrap">
          <button type="button" id="pdf-attach" title="Attach a PDF">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
            <span id="pdf-attach-label">PDF</span>
          </button>
          <!-- clears the attachment; only shown while a PDF is attached -->
          <button type="button" id="pdf-clear" title="Remove PDF" aria-label="Remove attached PDF" hidden>
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
                 stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18"/>
              <line x1="18" y1="6" x2="6" y2="18"/>
            </svg>
          </button>
          <input type="file" id="pdf-file" accept=".pdf" hidden>
          <div id="pdf-menu">
            <div class="menu-header">Attach a PDF</div>
            <div id="pdf-list"></div>
            <button type="button" id="pdf-upload-item">⬆ Upload a PDF…</button>
          </div>
        </div>
        <input id="chat-input" placeholder="Ask something about the selected PDF…" autocomplete="off" disabled>
        <button id="chat-send" title="Send" disabled>➤</button>
      </form>
    </div>
  </main>

  <!-- Floating progress log (bottom-right), toggled by the round button -->
  <button id="progress-toggle" title="Show progress log">📜</button>
  <div id="progress-panel">
    <div class="panel-header">
      <span>Progress</span>
      <button id="progress-close" title="Collapse" aria-label="Collapse progress log">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="progress"></div>
  </div>

  <!-- Confirmation window for the Stop server button -->
  <div id="confirm-overlay" hidden>
    <div id="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-title" id="confirm-title">Stop the server?</div>
      <div class="confirm-text">
        Any running operation will be terminated and you'll need to relaunch the app to continue.
      </div>
      <div class="confirm-actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-stop">⏹ Stop server</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=16"></script>
</body>
</html>
