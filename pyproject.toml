[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "techclass"
version = "0.1.0"
description = "Extract and classify technology data from PDFs with GitHub Copilot or Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "github-copilot-sdk==1.0.7",
  "httpx>=0.28,<1",
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
techclass = "techclass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["techclass"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
asyncio_mode = "auto"

