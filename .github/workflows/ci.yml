name: ci

on:
  push:
    branches:
      - main
      - joss-prep
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TechClass.sln

      - name: Build
        run: dotnet build TechClass.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TechClass.sln --configuration Release --no-build --verbosity normal
